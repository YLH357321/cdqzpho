<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>导航页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0b2b3f 0%, #1a4a6f 100%);
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            overflow: hidden; /* 确保无滚动条 */
        }

        .header {
            text-align: center;
            margin-bottom: 2vh;
            font-size: calc(2.5rem + 1vw);
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3vw;
            max-width: 90vw;
            width: 100%;
            flex-grow: 1;
            min-height: 0;
            padding: 1vh 0;
        }

        .circle-btn {
            aspect-ratio: 1; /* 保持圆形比例 */
            width: 22vw;
            max-width: 260px;
            min-width: 170px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,245,0.95), rgba(240,248,255,0.9));
            backdrop-filter: blur(1px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3), 0 8px 12px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: calc(1.5rem + 1vw);
            letter-spacing: 2px;
            color: #1e2f3a;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            border: 3px solid rgba(255, 242, 210, 0.7);
            padding: 1rem;
            line-height: 1.3;
            box-sizing: border-box;
        }

        .circle-btn:hover {
            transform: scale(1.05) translateY(-6px);
            background: radial-gradient(circle at 40% 35%, #fffef7, #fef7e0);
            box-shadow: 0 28px 38px rgba(0, 0, 0, 0.4), 0 12px 18px rgba(0, 0, 0, 0.25);
            border-color: #ffe2a4;
            color: #0a2f44;
        }

        .circle-btn:active {
            transform: scale(0.97) translateY(2px);
            transition: 0.05s linear;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
        }

        .info-footer {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255, 248, 225, 0.7);
            background: rgba(0,0,0,0.2);
            width: fit-content;
            margin: 0 auto;
            padding: 6px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            font-family: monospace;
            z-index: 1;
        }
        
        .circle-btn:focus-visible {
            outline: 4px solid #ffd966;
            outline-offset: 6px;
            background: radial-gradient(circle at 40% 35%, #fffae9, #fff2cf);
        }
    </style>
</head>
<body>
    <div class="header">物理</div>
    
    <div class="button-container">
        <a href="countdown/countdown.html" class="circle-btn" title="前往倒计时工具">
            计时器
        </a>
        
        <a href="time/time.html" class="circle-btn" title="查看当前时间">
            当前时间
        </a>
        
        <a href="fortune/fortune.html" class="circle-btn" title="查看运势">
            运势
        </a>
        
        <div class="circle-btn" style="cursor: default;" title="预留按钮">
            
        </div>
    </div>
    
    <div class="info-footer">
        📁CDQZPHO
    </div>
</body>
</html>
